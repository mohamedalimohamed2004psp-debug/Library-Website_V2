<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>Edit Book ✏️</h2>
        <form method="POST" action="/edit_book/{{ book.book_id }}">
            <label>Book Title</label>
            <input type="text" name="title" value="{{ book.title }}" required>

            <label>Price</label>
            <input type="number" step="0.01" name="price" value="{{ book.price }}" required>

            <label>Publish Year</label>
            <input type="number" name="publish_year" value="{{ book.publish_year }}" required>

            <label>Author</label>
            <select name="author_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                {% for author in authors %}
                    <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>
                        {{ author.name }}
                    </option>
                {% endfor %}
            </select>

            <label>Publisher</label>
            <select name="publisher_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                {% for pub in publishers %}
                    <option value="{{ pub.publisher_id }}" {% if pub.publisher_id == book.publisher_id %}selected{% endif %}>
                        {{ pub.name }}
                    </option>
                {% endfor %}
            </select>

            <label>Category</label>
            <select name="category_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                {% for cat in categories %}
                    <option value="{{ cat.category_id }}" {% if cat.category_id == book.category_id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Update Book</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">Cancel and Back</a>
        </div>
    </div>
</body>
</html>
