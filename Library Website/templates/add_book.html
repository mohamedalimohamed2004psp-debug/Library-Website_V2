<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h2>Add New Book 📚</h2>
        <form method="POST" action="/add_book">
            <label>Book Title</label>
            <input type="text" name="title" placeholder="e.g. Hamlet" required>

            <label>Price</label>
            <input type="number" step="0.01" name="price" placeholder="e.g. 150.00" required>

            <label>Publish Year</label>
            <input type="number" name="publish_year" placeholder="e.g. 2026" required>

            <label>Author</label>
            <select name="author_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                <option value="" disabled selected>Select author...</option>
                {% for author in authors %}
                    <option value="{{ author.author_id }}">{{ author.name }}</option>
                {% endfor %}
            </select>

            <label>Publisher</label>
            <select name="publisher_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                <option value="" disabled selected>Select publisher...</option>
                {% for pub in publishers %}
                    <option value="{{ pub.publisher_id }}">{{ pub.name }}</option>
                {% endfor %}
            </select>

            <label>Category</label>
            <select name="category_id" required style="width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; margin-top: 5px; margin-bottom: 15px;">
                <option value="" disabled selected>Select category...</option>
                {% for cat in categories %}
                    <option value="{{ cat.category_id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>

            <button type="submit">Save Book</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/dashboard" style="color: #7f8c8d; text-decoration: none; font-size: 14px;">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
